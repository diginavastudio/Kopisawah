<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopi Sawah — Uji Coba Tim</title>
<style>
:root{--ink:#24342b;--muted:#6b786f;--green:#315c42;--cream:#f5f2e8;--line:#e5e7df;--white:#fff;--red:#a34535;--gold:#c58a35}
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:var(--green);color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:20px;margin:0}header small{opacity:.8}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 66px)}nav{background:#edf0e9;border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}nav button{border:0;background:transparent;text-align:left;border-radius:10px;padding:11px 12px;color:var(--ink)}nav button.active,nav button:hover{background:var(--green);color:white}main{padding:22px;min-width:0}.banner{padding:12px 14px;background:#fff3dc;border:1px solid #f0dcae;border-radius:12px;margin-bottom:16px;color:#6d4b16}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:4px 0 16px}.head h2{margin:0 0 4px;font-size:24px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(130px,1fr));margin:12px 0 18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font-size:25px;display:block;margin-top:5px}.stat span{color:var(--muted)}.two{grid-template-columns:1.15fr .85fr}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.field{border:1px solid #d7ddd4;border-radius:9px;padding:9px 11px;background:white;min-width:150px}.btn{border:0;border-radius:9px;background:var(--green);color:white;padding:9px 13px;font-weight:650}.btn.secondary{background:#e7eee8;color:var(--green)}.btn.warn{background:#fff0dd;color:#764a14}.btn:disabled{opacity:.45;cursor:not-allowed}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:12px;color:var(--muted);background:#fafbf9}.thumb{width:54px;height:44px;object-fit:cover;border-radius:8px;background:#eee}.product{display:flex;align-items:center;gap:9px;min-width:185px}.price-input{width:118px;min-width:100px}.small-input{width:90px;min-width:75px}.status{display:inline-block;padding:3px 8px;border-radius:99px;font-size:12px;background:#edf0e9}.status.warn{background:#fff0dd;color:#764a14}.status.good{background:#e4f2e7;color:#25623b}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.menu-card{border:1px solid var(--line);border-radius:13px;background:white;overflow:hidden}.menu-card img{width:100%;height:110px;object-fit:cover;display:block;background:#eee}.menu-body{padding:10px}.menu-body b{display:block;min-height:40px}.menu-body small{display:block;color:var(--muted);min-height:30px}.cash-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.cart-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}.qty{display:flex;align-items:center;gap:7px}.qty button{border:1px solid var(--line);background:white;border-radius:7px;width:27px;height:27px}.total{font-size:20px;font-weight:750;display:flex;justify-content:space-between;padding:12px 0}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#24342b;color:white;padding:10px 16px;border-radius:10px;display:none;z-index:5;box-shadow:0 5px 20px #0002}.toast.show{display:block}.empty{padding:28px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted)}@media(max-width:850px){.shell{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.shell nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cash-layout,.two{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:14px}}@media(max-width:480px){header{padding:14px}header h1{font-size:17px}.head h2{font-size:20px}.stats{gap:8px}.card,.panel{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.menu-card img{height:92px}.field{min-width:0;width:100%}.toolbar>*{flex:1}.form-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div><h1>☕ Kopi Sawah</h1><small>Uji coba alur kasir — data dummy tim</small></div><small>MODE UJI • DATA TERSIMPAN</small></header>
<div id="previewNotice" class="banner" role="status" style="margin:12px 22px 0"><b>Mode uji tim.</b> Perubahan menu, stok, dan transaksi tersimpan pada basis data uji. Gunakan data dummy saja; jangan masukkan data pelanggan atau penjualan nyata.</div>
<div class="shell"><nav id="nav"><button data-view="home" class="active">Ringkasan</button><button data-view="cash">Kasir</button><button data-view="products">Menu & Harga</button><button data-view="stock">Stok</button><button data-view="sales">Riwayat</button><button data-view="reports">Laporan</button></nav><main id="main"></main></div>
<div id="toast" class="toast"></div>
<script>
const main=document.querySelector('#main');let view='home',cart=new Map(),allProducts=[];const PREVIEW_READ_ONLY=false;const money=n=>n==null?'Perlu diisi':'Rp'+new Intl.NumberFormat('id-ID').format(n);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch(e){};if(!r.ok)throw new Error(d.error||(r.status===403?'Penyimpanan sedang ditutup (pratinjau baca-saja).':'Permintaan gagal ('+r.status+')'));return d}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function applyPreviewMode(){if(!PREVIEW_READ_ONLY)return;document.querySelectorAll('[data-save-price],#addProduct,[data-save-stock],#checkout').forEach(b=>{b.disabled=true;b.title='Pratinjau: penyimpanan dimatikan'});document.querySelectorAll('.price-input,#newName,#newCategory,#newVariant,#newPrice,#paymentMethod,[data-count],[data-reorder]').forEach(i=>i.disabled=true)}
function title(t,sub){return `<div class="head"><div><h2>${t}</h2><div class="muted">${sub}</div></div></div>`}
function photo(p){return `<img class="thumb" src="/static/images/${esc(p.image_key||'snack')}.jpg" alt="" loading="lazy">`}
async function loadProducts(){allProducts=(await api('/api/products')).items;return allProducts}
async function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));try{if(view==='home')await home();if(view==='products')await productsPage();if(view==='cash')await cashPage();if(view==='stock')await stockPage();if(view==='sales')await salesPage();if(view==='reports')await reportsPage();applyPreviewMode()}catch(e){main.innerHTML=`<div class="panel">Gagal memuat: ${esc(e.message)}</div>`}}
async function home(){const s=await api('/api/reports/summary');const p=await loadProducts();main.innerHTML=`${title('Ringkasan','Semua angka berasal dari catatan lokal aplikasi uji.')}
<div class="banner"><b>Masih aplikasi uji.</b> Pembayaran hanya dicatat manual; belum terhubung ke bank atau layanan pembayaran. Menu dan harga berasal dari draf berkas menu. Harga/stok yang belum dipastikan tetap kosong.</div>
<div class="grid stats"><div class="card stat"><span>Menu aktif</span><b>${p.length}</b></div><div class="card stat"><span>Transaksi hari ini (${s.today})</span><b>${s.today_transactions}</b></div><div class="card stat"><span>Nilai tercatat hari ini</span><b>${money(s.today_total)}</b></div><div class="card stat"><span>Stok belum dilacak</span><b>${s.unknown_stock}</b></div></div>
<div class="grid two"><div class="panel"><h3>Mulai dari</h3><p>${PREVIEW_READ_ONLY?'Lihat katalog, kasir, stok, riwayat, dan laporan uji. Perubahan tidak disimpan.':'Isi harga yang belum pasti, catat hitungan stok nyata, lalu gunakan kasir uji untuk transaksi percobaan.'}</p><button class="btn" data-go="products">Buka Menu & Harga</button> <button class="btn secondary" data-go="stock">Buka Stok</button></div><div class="panel"><h3>Batas uji</h3><p class="note">Perubahan dan transaksi dummy tersimpan untuk ditinjau tim. Jangan masukkan data pelanggan atau penjualan nyata; jika data uji perlu dibersihkan, minta reset agar salinan cadangan dibuat dulu.</p></div></div>`;bindGo()}
async function productsPage(){const rows=await loadProducts();main.innerHTML=`${title('Menu & Harga',PREVIEW_READ_ONLY?'Harga draf untuk dilihat saja.':'Ubah harga secara manual; kosong berarti belum dikonfirmasi.')}
<div class="banner">${PREVIEW_READ_ONLY?'Semua harga adalah draf; penyimpanan dinonaktifkan pada pratinjau publik.':'Semua harga di sini adalah draf. Tombol simpan hanya menulis ke basis data lokal uji, bukan ke sistem produksi.'}</div>
<div class="panel" style="margin-bottom:12px"><h3>Tambah menu</h3><div class="form-grid"><input id="newName" class="field" placeholder="Nama menu"><input id="newCategory" class="field" placeholder="Kategori"><input id="newVariant" class="field" placeholder="Varian (opsional)"><input id="newPrice" class="field" type="number" min="1" placeholder="Harga (opsional)"></div><div style="margin-top:8px"><button id="addProduct" class="btn">Tambah ke draf lokal</button></div></div>
<div class="toolbar"><input id="productSearch" class="field" placeholder="Cari menu, kategori, varian"><select id="productCat" class="field"><option>Semua</option>${[...new Set(rows.map(p=>p.category))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select><span class="status">${rows.length} entri draf</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Menu</th><th>Kategori</th><th>Harga</th><th>Varian</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="productsRows">${rows.map(p=>`<tr data-row="${esc(p.id)}"><td><div class="product">${photo(p)}<div><b>${esc(p.name)}</b><div class="note">${esc(p.id)}</div></div></div></td><td>${esc(p.category)}</td><td><input class="field price-input" data-price="${esc(p.id)}" type="number" min="1" value="${p.price??''}" placeholder="Belum diisi"></td><td>${esc(p.variant||'—')}</td><td>${p.stock_on_hand==null?'<span class="status warn">Belum diatur</span>':esc(p.stock_on_hand)}</td><td><button class="btn secondary" data-save-price="${esc(p.id)}">Simpan harga</button></td></tr>`).join('')}</tbody></table></div>`;
 document.querySelector('#productSearch').addEventListener('input',filterProducts);document.querySelector('#productCat').addEventListener('change',filterProducts);
 document.querySelectorAll('[data-save-price]').forEach(b=>b.onclick=async()=>{const id=b.dataset.savePrice,v=document.querySelector(`[data-price="${CSS.escape(id)}"]`).value;try{await api('/api/products/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({price:v===''?null:Number(v)})});toast('Harga disimpan di basis data lokal uji');await productsPage()}catch(e){toast(e.message)}});
 document.querySelector('#addProduct').onclick=async()=>{const name=document.querySelector('#newName').value.trim(),category=document.querySelector('#newCategory').value.trim(),variant=document.querySelector('#newVariant').value.trim(),pv=document.querySelector('#newPrice').value;try{await api('/api/products',{method:'POST',body:JSON.stringify({name,category,variant,price:pv===''?null:Number(pv)})});toast('Menu masuk ke draf lokal');await productsPage()}catch(e){toast(e.message)}};}
function filterProducts(){const q=document.querySelector('#productSearch').value.toLowerCase(),cat=document.querySelector('#productCat').value;document.querySelectorAll('#productsRows tr').forEach(tr=>{const text=tr.innerText.toLowerCase();tr.hidden=!(text.includes(q)&&(cat==='Semua'||tr.cells[1].innerText===cat))})}
async function cashPage(){const rows=await loadProducts();main.innerHTML=`${title('Kasir uji',PREVIEW_READ_ONLY?'Tampilan saja; transaksi tidak dapat disimpan.':'Transaksi disimpan di basis data lokal. Metode pembayaran hanya dicatat, tidak diproses.')}
<div class="banner">${PREVIEW_READ_ONLY?'Keranjang hanya simulasi layar; tombol simpan transaksi dinonaktifkan.':'Jangan gunakan untuk penjualan nyata. Menu tanpa harga tidak dapat dimasukkan; menu berlabel “Belum dilacak” tidak memotong stok. Diskon masih dinonaktifkan.'}</div><div class="cash-layout"><div><div class="toolbar"><input class="field" id="cashSearch" placeholder="Cari menu"><select class="field" id="cashCat"><option>Semua</option>${[...new Set(rows.map(p=>p.category))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="cards" id="menuCards">${rows.map(p=>`<article class="menu-card" data-card="${esc(p.id)}">${photo(p)}<div class="menu-body"><b>${esc(p.name)}</b><small>${esc(p.variant||p.category)}</small><strong>${money(p.price)}</strong><button class="btn" style="width:100%;margin-top:8px" data-add="${esc(p.id)}" ${p.price==null?'disabled':''}>Tambah</button></div></article>`).join('')}</div></div>
<aside class="panel"><h3>Keranjang</h3><div id="cartRows"></div><div class="total"><span>Total</span><span id="cartTotal">Rp0</span></div><label class="note" for="paymentMethod">Metode pembayaran (catatan manual)</label><input id="paymentMethod" class="field" style="width:100%;margin:5px 0 10px" placeholder="Isi setelah metode usaha dipastikan"><button id="checkout" class="btn" style="width:100%" disabled>Simpan transaksi uji</button><p class="note">Tidak mengirim pembayaran ke bank/penyedia.</p></aside></div>`;
 document.querySelector('#cashSearch').addEventListener('input',filterCash);document.querySelector('#cashCat').addEventListener('change',filterCash);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=rows.find(x=>x.id===b.dataset.add);const old=cart.get(p.id);cart.set(p.id,{product:p,quantity:(old?.quantity||0)+1});drawCart()});drawCart();document.querySelector('#checkout').onclick=checkout;}
function filterCash(){const q=document.querySelector('#cashSearch').value.toLowerCase(),cat=document.querySelector('#cashCat').value;document.querySelectorAll('#menuCards .menu-card').forEach(card=>{const p=allProducts.find(x=>x.id===card.dataset.card);card.hidden=!((`${p.name} ${p.category} ${p.variant}`).toLowerCase().includes(q)&&(cat==='Semua'||cat===p.category))})}
function drawCart(){const el=document.querySelector('#cartRows');if(!el)return;const items=[...cart.values()];el.innerHTML=items.length?items.map(x=>`<div class="cart-row"><div><b>${esc(x.product.name)}</b><div class="note">${money(x.product.price)} × ${x.quantity}</div></div><div class="qty"><button data-minus="${esc(x.product.id)}">−</button><span>${x.quantity}</span><button data-plus="${esc(x.product.id)}">+</button></div></div>`).join(''):'<div class="empty">Keranjang kosong</div>';const total=items.reduce((s,x)=>s+x.product.price*x.quantity,0);document.querySelector('#cartTotal').textContent=money(total);document.querySelector('#checkout').disabled=PREVIEW_READ_ONLY||!items.length;el.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));el.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));}
function changeQty(id,delta){const x=cart.get(id);if(!x)return;x.quantity+=delta;if(x.quantity<=0)cart.delete(id);drawCart()}
let checkoutKey=null,checkoutBusy=false;function newCheckoutKey(){return crypto.randomUUID?crypto.randomUUID():('ks-'+Date.now()+'-'+Math.random().toString(16).slice(2))}
async function checkout(){if(checkoutBusy)return;const method=document.querySelector('#paymentMethod').value.trim();if(!method)return toast('Isi metode pembayaran yang dicatat');const items=[...cart.values()].map(x=>({product_id:x.product.id,quantity:x.quantity}));const btn=document.querySelector('#checkout');if(!checkoutKey)checkoutKey=newCheckoutKey();checkoutBusy=true;btn.disabled=true;btn.textContent='Menyimpan...';try{const r=await api('/api/sales',{method:'POST',body:JSON.stringify({items,payment_method:method,discount_amount:0,request_id:checkoutKey})});checkoutKey=null;cart.clear();toast(r.duplicate?'Transaksi ini sudah tersimpan: '+r.item.id:'Tercatat lokal: '+r.item.id);await cashPage()}catch(e){toast(e.message);btn.disabled=false;btn.textContent='Simpan transaksi uji'}finally{checkoutBusy=false}}
async function stockPage(){const rows=(await api('/api/stock')).items;main.innerHTML=`${title('Stok',PREVIEW_READ_ONLY?'Angka stok uji hanya untuk dilihat.':'Isi angka hanya setelah menghitung stok fisik.')}
<div class="banner">${PREVIEW_READ_ONLY?'Pratinjau baca-saja; perubahan stok dan ambang pengingat tidak disimpan.':'Stok belum diperiksa ditandai “Belum diatur”. Ambang pengingat tetap kosong sampai aturan usaha ditentukan.'}</div><div class="toolbar"><input id="stockSearch" class="field" placeholder="Cari menu atau kategori"></div><div class="table-wrap"><table class="table"><thead><tr><th>Menu</th><th>Stok saat ini</th><th>Hitungan fisik</th><th>Ambang pengingat</th><th>Aksi</th></tr></thead><tbody id="stockRows">${rows.map(p=>`<tr data-stock-row="${esc(p.id)}"><td><div class="product">${photo(p)}<div><b>${esc(p.name)}</b><div class="note">${esc(p.category)} · ${esc(p.variant||'—')}</div></div></div></td><td>${p.stock_tracked?(p.stock_on_hand==null?'<span class="status warn">Terlacak, kosong</span>':`<span class="status good">${esc(p.stock_on_hand)}</span>`):'<span class="status warn">Belum dilacak</span>'}</td><td><input class="field small-input" data-count="${esc(p.id)}" type="number" min="0" placeholder="Hitung"></td><td><input class="field small-input" data-reorder="${esc(p.id)}" type="number" min="0" value="${p.reorder_level??''}" placeholder="Belum diatur"></td><td><button class="btn secondary" data-save-stock="${esc(p.id)}">Simpan hitungan</button> <button class="btn warn" data-untrack="${esc(p.id)}" ${p.stock_tracked?'':'disabled'}>Tanpa potong stok</button></td></tr>`).join('')}</tbody></table></div>`;
 document.querySelector('#stockSearch').addEventListener('input',()=>{const q=document.querySelector('#stockSearch').value.toLowerCase();document.querySelectorAll('#stockRows tr').forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(q))});document.querySelectorAll('[data-save-stock]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveStock,qty=document.querySelector(`[data-count="${CSS.escape(id)}"]`).value,re=document.querySelector(`[data-reorder="${CSS.escape(id)}"]`).value;try{if(qty!=='')await api('/api/stock/count',{method:'POST',body:JSON.stringify({product_id:id,counted_quantity:Number(qty),note:'Hitungan fisik manual'})});await api('/api/products/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({reorder_level:re===''?null:Number(re)})});toast('Stok/ambang disimpan di basis data uji');await stockPage()}catch(e){toast(e.message)}});document.querySelectorAll('[data-untrack]').forEach(b=>b.onclick=async()=>{try{await api('/api/products/'+encodeURIComponent(b.dataset.untrack),{method:'PUT',body:JSON.stringify({stock_tracked:false})});toast('Menu ini tidak lagi memotong stok');await stockPage()}catch(e){toast(e.message)}});}
async function salesPage(){const rows=(await api('/api/sales')).items;main.innerHTML=`${title('Riwayat transaksi','Catatan lokal uji; bukan bukti pembayaran nyata.')}<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Waktu (WIB)</th><th>Rincian</th><th>Metode dicatat</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows.length?rows.map(s=>`<tr><td><b>${esc(s.id)}</b></td><td>${esc(s.created_at)}</td><td>${s.items.map(i=>`${esc(i.name_snapshot)}${i.variant_snapshot?' ('+esc(i.variant_snapshot)+')':''} × ${i.quantity}`).join('<br>')}</td><td>${esc(s.payment_method)}</td><td>${money(s.total_amount)}</td><td><span class="status warn">Tercatat lokal</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada transaksi uji</td></tr>'}</tbody></table></div>`}
async function reportsPage(){const s=await api('/api/reports/summary');main.innerHTML=`${title('Laporan','Dihitung dari transaksi dan pergerakan stok yang tersimpan.')}
<div class="grid stats"><div class="card stat"><span>Total transaksi tercatat</span><b>${s.all_transactions}</b></div><div class="card stat"><span>Nilai transaksi tercatat</span><b>${money(s.all_total)}</b></div><div class="card stat"><span>Menu di bawah ambang</span><b>${s.low_stock}</b></div><div class="card stat"><span>Menu stok belum dilacak</span><b>${s.unknown_stock}</b></div></div><div class="panel"><b>Catatan</b><p class="note">Laporan ini hanya menghitung data yang masuk ke aplikasi uji. Diskon, pajak, biaya pembayaran, retur, dan pembatalan belum diterapkan. Zona waktu laporan: ${esc(s.timezone)} (WIB); mode wajib stok: ${s.require_stock?'aktif':'nonaktif'}.</p></div>`}
function bindGo(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()})}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script>
</body></html>
