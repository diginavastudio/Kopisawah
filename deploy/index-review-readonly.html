<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopi Sawah — Kasir Klaten</title>
<link rel="icon" href="/static/images/logo-kopi-sawah-transparan.png">
<style>
:root{
  --bg:#12150c; --bg2:#191d10; --card:#202516; --card2:#272d1b; --line:#3a4126;
  --gold:#e9d27a; --gold2:#c9a84e; --cream:#f4efdc; --muted:#a9b092; --ok:#8bc79a; --warn:#e8c26a; --bad:#e2795f;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 15% -10%,#22280f 0%,var(--bg) 55%) no-repeat,var(--bg);color:var(--cream);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.2px}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(180deg,#1d2213,#151910);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top img.logo{height:34px;width:auto;display:block}
.top .brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.tag{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#1d2213;color:var(--muted)}
.badge.live{color:var(--gold);border-color:#5b5228;background:#241f0f}
nav{display:flex;gap:6px;padding:10px 16px;overflow:auto;background:#151910;border-bottom:1px solid var(--line);position:sticky;top:63px;z-index:19}
nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;white-space:nowrap}
nav button:hover{color:var(--cream);background:#1e2414}
nav button.active{background:linear-gradient(180deg,#3b3a1c,#2b2a12);border-color:#6b5f2c;color:var(--gold)}
main{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 16px}
.head h2{margin:0;font-size:26px}
.head p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:linear-gradient(180deg,var(--card),#1b2012);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font-size:26px;margin-top:6px;font-family:Georgia,serif;color:var(--gold)}
.stat span{color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.hero .foto{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0c0f07;min-height:190px}
.hero .foto img{width:100%;height:100%;object-fit:cover;display:block;max-height:260px}
.btn{border:1px solid #6b5f2c;background:linear-gradient(180deg,#4a4620,#33300f);color:var(--gold);padding:10px 14px;border-radius:11px;font-weight:650}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#1e2414;border-color:var(--line);color:var(--cream)}
.btn.mini{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.danger{background:#2a1410;border-color:#6b2f26;color:#f0a08e}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.field{background:#131710;border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:120px}
.field:focus{outline:1px solid #6b5f2c}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#191e11;color:var(--muted);padding:7px 12px;border-radius:999px;font-size:12.5px}
.chips button.active{border-color:#6b5f2c;color:var(--gold);background:#241f0f}
.kasir{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.menus{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.produk{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.produk img{width:100%;height:104px;object-fit:cover;display:block;background:#0c0f07}
.produk .isi{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.produk b{font-size:13.5px;line-height:1.25;min-height:34px}
.produk .harga{color:var(--gold);font-weight:700;font-family:Georgia,serif}
.produk .varian{font-size:11px;color:var(--muted)}
.produk .btn{margin-top:6px;width:100%}
.keranjang{position:sticky;top:126px;background:linear-gradient(180deg,var(--card2),#1d2213);border:1px solid var(--line);border-radius:16px;padding:14px}
.keranjang h3{margin:0 0 10px;font-size:17px}
.baris{display:flex;gap:8px;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #333a22}
.baris .nama{font-size:13px}
.baris .opsi{font-size:11.5px;color:var(--gold2)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#131710}
.qty span{min-width:16px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 8px;font-size:15px}
.total b{font-size:23px;color:var(--gold);font-family:Georgia,serif}
table{width:100%;border-collapse:collapse}
.tabel{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#171c10}
th,td{padding:10px 12px;border-bottom:1px solid #2c331d;text-align:left;vertical-align:middle;font-size:13px}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#141810;position:sticky;top:0}
td img.thumb{width:48px;height:40px;object-fit:cover;border-radius:8px;background:#0c0f07}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;background:#232a17;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:#2f4d35;background:#1a2a1c}
.pill.warn{color:var(--warn);border-color:#584a24;background:#2a2310}
.pill.bad{color:var(--bad);border-color:#5a2b23;background:#2a1512}
.layar{position:fixed;inset:0;background:#0b0d06e0;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#242a18,#1a1f12);border:1px solid #6b5f2c;border-radius:18px;padding:16px}
.sheet h3{margin:0 0 2px}
.sheet .hint{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.grup{margin:14px 0}
.grup .judul{display:flex;justify-content:space-between;font-size:13px;color:var(--gold);margin-bottom:6px}
.grup label{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#141810;cursor:pointer}
.grup label.on{border-color:#6b5f2c;background:#241f0f}
.grup label .tambah{margin-left:auto;color:var(--gold2);font-size:12.5px}
.kaki{display:flex;gap:8px;margin-top:14px}
.kaki .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b3118;border:1px solid #6b5f2c;color:var(--cream);padding:11px 16px;border-radius:12px;display:none;z-index:90;max-width:90vw}
.toast.show{display:block}
.kosong{padding:26px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:12.5px}
.dua{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.kelompok{border:1px solid var(--line);border-radius:14px;padding:12px;background:#181d10;margin-bottom:12px}
.kelompok .kepala{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.kelompok .kepala b{font-family:Georgia,serif;font-size:15px;color:var(--gold)}
.opsi-baris{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.opsi-baris .field{padding:6px 9px;font-size:12.5px}
.cek{display:flex;gap:8px;flex-wrap:wrap}
.cek label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:#141810;cursor:pointer;font-size:12.5px}
.cek label.on{border-color:#6b5f2c;color:var(--gold);background:#241f0f}
@media(max-width:1000px){.hero,.dua{grid-template-columns:1fr}.kasir{grid-template-columns:1fr}.keranjang{position:static}}
@media(max-width:640px){nav{top:59px}.top img.logo{height:28px}}
</style>
</head>
<body>
<div class="top">
  <img class="logo" src="/static/images/logo-kopi-sawah-transparan.png" alt="Kopi Sawah">
  <div class="brand"><small>Kasir &amp; katalog · Klaten</small></div>
  <div class="tag">
    <span class="badge" id="zonaBadge">—</span>
    <span class="badge live" id="modeBadge">Mode uji</span>
  </div>
</div>
<nav id="nav">
  <button data-view="home">Ringkasan</button>
  <button data-view="kasir">Kasir</button>
  <button data-view="menu">Menu &amp; Harga</button>
  <button data-view="stok">Stok</button>
  <button data-view="riwayat">Riwayat</button>
  <button data-view="laporan">Laporan</button>
  <button data-view="varian">Varian</button>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
const PREVIEW_READ_ONLY=true;
const state={view:'home',cart:new Map(),products:[],varian:{groups:[],categories:{}},qc:'',qcat:'Semua',adding:null,picked:new Map()};
const el=s=>document.querySelector(s);
const money=n=>n==null?'Perlu diisi':'Rp'+new Intl.NumberFormat('id-ID').format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>n?('+Rp'+new Intl.NumberFormat('id-ID').format(n)):'';
function toast(t){const b=el('#toast');b.textContent=t;b.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>b.classList.remove('show'),2800)}
async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch(e){}
  if(!r.ok)throw new Error(d.error||(r.status===403?'Penyimpanan sedang ditutup.':'Permintaan gagal ('+r.status+')'));
  return d;
}
function lokal(ts){try{return new Date(ts).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ts}}
function title(t,sub){return `<div class="head"><div><h2>${t}</h2><p>${sub||''}</p></div></div>`}

/* ---------- data ---------- */
async function loadProduk(force){
  if(!state.products.length||force)state.products=(await api('/api/products')).items;
  return state.products;
}
async function loadVarian(force){
  if(!state.varian.groups.length||force)state.varian=await api('/api/modifiers');
  return state.varian;
}
function grupUntuk(kategori){
  const ids=state.varian.categories[kategori]||[];
  return ids.map(id=>state.varian.groups.find(g=>g.id===id)).filter(Boolean);
}

/* ---------- keranjang ---------- */
function kunciBaris(pid,opts){return pid+'|'+opts.map(o=>o.id).sort().join(',')}
function tambah(p,opts){
  const key=kunciBaris(p.id,opts), ada=state.cart.get(key);
  if(ada)ada.qty++; else state.cart.set(key,{key,p,opts,qty:1});
  gambarKeranjang();
}
function ubahQty(key,d){const x=state.cart.get(key);if(!x)return;x.qty+=d;if(x.qty<=0)state.cart.delete(key);gambarKeranjang()}
function totalKeranjang(){let t=0;for(const x of state.cart.values())t+=(x.p.price+(x.opts||[]).reduce((s,o)=>s+o.delta,0))*x.qty;return t}

/* ---------- tampilan ---------- */
const views={};
views.home=async()=>{
  const s=await api('/api/reports/summary');const p=await loadProduk();
  el('#main').innerHTML=title('Ringkasan','Kopi Sawah Klaten · '+new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'full'}).format(new Date()))
  +`<div class="grid stats">
     <div class="card stat"><span>Menu aktif</span><b>${p.length}</b></div>
     <div class="card stat"><span>Transaksi hari ini</span><b>${s.today_transactions}</b></div>
     <div class="card stat"><span>Nilai hari ini</span><b>${money(s.today_total)}</b></div>
     <div class="card stat"><span>Stok belum dilacak</span><b>${s.unknown_stock}</b></div>
   </div>
   <div class="hero" style="margin-top:16px">
     <div class="card"><h3 style="margin-top:0">Mulai kerja</h3>
       <p class="note">Masuk ke kasir untuk mencatat pesanan (varian susu, gula, es, ukuran, sambal otomatis tersedia sesuai kategori). Perbarui harga di menu, isi stok fisik, lalu pantau laporan.</p>
       <div class="toolbar" style="margin:0">
         <button class="btn" data-go="kasir">Buka Kasir</button>
         <button class="btn ghost" data-go="menu">Menu &amp; Harga</button>
         <button class="btn ghost" data-go="stok">Stok</button>
         <button class="btn ghost" data-go="varian">Atur Varian</button>
       </div>
     </div>
     <div class="foto"><img src="/static/images/kartu-menu.jpg" alt="Kartu menu Kopi Sawah"></div>
   </div>
   <div class="card" style="margin-top:16px">
     <h3 style="margin-top:0">Catatan uji</h3>
     <p class="note">Data ini untuk uji coba internal. Belum ada login/peran, belum ada pajak, diskon, cetak struk, atau tutup kasir. Zona waktu laporan: ${esc(s.timezone)}. Mode wajib stok: ${s.require_stock?'aktif':'nonaktif'}.</p>
   </div>`;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.view=b.dataset.go;render()});
};

views.kasir=async()=>{
  const p=await loadProduk();const v=await loadVarian();
  const kats=[...new Set(p.map(x=>x.category))].sort();
  el('#main').innerHTML=title('Kasir','Ketuk menu untuk memilih varian. Harga bertanda + adalah tambahan.')
   +`<div class="kasir"><div>
      <div class="toolbar"><input class="field" id="qc" placeholder="Cari menu…" value="${esc(state.qc)}" style="flex:1;min-width:180px">
      <span class="badge">${p.filter(x=>x.price==null).length} menu tanpa harga</span></div>
      <div class="chips" id="kats" style="margin-bottom:14px">${['Semua',...kats].map(k=>`<button data-kat="${esc(k)}" class="${state.qcat===k?'active':''}">${esc(k)}</button>`).join('')}</div>
      <div class="menus" id="daftarMenu"></div>
    </div><aside class="keranjang">
      <h3>Pesanan</h3>
      <div id="isiKeranjang"></div>
      <div class="total"><span>Total</span><b id="totalKeranjang">Rp0</b></div>
      <input class="field" id="metode" placeholder="Metode bayar (tunai / QRIS …)" style="width:100%;margin-bottom:8px">
      <button class="btn" id="simpan" style="width:100%">Simpan pesanan</button>
      <p class="note" style="margin:8px 0 0">Pembayaran hanya dicatat, belum diproses.</p>
    </aside></div>`;
  const gambar=()=>{
    const q=state.qc.toLowerCase();
    const list=p.filter(x=>(state.qcat==='Semua'||x.category===state.qcat)&&(`${x.name} ${x.category} ${x.variant}`).toLowerCase().includes(q));
    el('#daftarMenu').innerHTML=list.length?list.map(x=>{
      const g=grupUntuk(x.category).length;
      return `<article class="produk"><img src="/static/images/${esc(x.image_key||'snack')}.jpg" alt="" loading="lazy">
        <div class="isi"><b>${esc(x.name)}</b>
        <span class="varian">${esc(x.variant||x.category)}${g?' · '+g+' pilihan varian':''}</span>
        <span class="harga">${money(x.price)}</span>
        <button class="btn mini" data-add="${esc(x.id)}" ${x.price==null?'disabled':''}>${g?'Pilih varian':'Tambah'}</button></div></article>`}).join(''):'<div class="kosong">Tidak ada menu yang cocok.</div>';
    document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
      const x=p.find(y=>y.id===b.dataset.add);const gs=grupUntuk(x.category);
      if(!gs.length){tambah(x,[]);toast(x.name+' masuk pesanan');return}
      bukaVarian(x,gs);
    });
  };
  el('#qc').oninput=e=>{state.qc=e.target.value;gambar()};
  document.querySelectorAll('[data-kat]').forEach(b=>b.onclick=()=>{state.qcat=b.dataset.kat;document.querySelectorAll('[data-kat]').forEach(x=>x.classList.toggle('active',x===b));gambar()});
  el('#simpan').onclick=simpanPesanan;
  gambar();gambarKeranjang();
};

function bukaVarian(p,groups){
  state.picked=new Map();
  groups.forEach(g=>{if(g.min_select>0&&g.options.length)state.picked.set(g.id,new Set([g.options[0].id]))});
  const wrap=document.createElement('div');wrap.className='layar';
  const lukis=()=>{
    let dasar=p.price, tambahan=0;
    const pilih=[];groups.forEach(g=>{(state.picked.get(g.id)||new Set()).forEach(id=>{const o=g.options.find(z=>z.id===id);if(o){pilih.push({id:o.id,name:o.name,delta:o.price_delta,group:g.name});tambahan+=o.price_delta}})});
    wrap.innerHTML=`<div class="sheet"><h3>${esc(p.name)}</h3>
      <div class="hint">${esc(p.variant||p.category)} · dasar ${money(dasar)}</div>
      ${groups.map(g=>`<div class="grup"><div class="judul"><span>${esc(g.name)}</span><span class="note">${g.min_select>0?'wajib':'opsional'}${g.max_select>1?' · maks '+g.max_select:''}</span></div>
        ${g.options.map(o=>{const on=(state.picked.get(g.id)||new Set()).has(o.id);
          return `<label class="${on?'on':''}" data-o="${esc(o.id)}" data-g="${esc(g.id)}">
            <input type="${g.max_select>1?'checkbox':'radio'}" name="g-${esc(g.id)}" ${on?'checked':''}>
            <span>${esc(o.name)}</span><span class="tambah">${rp(o.price_delta)||'—'}</span></label>`}).join('')}
      </div>`).join('')}
      <div class="kaki"><button class="btn ghost" data-batal>Batal</button>
      <button class="btn" data-pilih>Masuk pesanan · ${money(dasar+tambahan)}</button></div></div>`;
    wrap.querySelectorAll('label[data-o]').forEach(l=>l.onclick=e=>{
      const gid=l.dataset.g,oid=l.dataset.o,g=groups.find(x=>x.id===gid);
      const set=state.picked.get(gid)||new Set();
      if(g.max_select>1){set.has(oid)?set.delete(oid):(set.size<g.max_select?set.add(oid):toast('Maksimal '+g.max_select+' pilihan'));}
      else{set.clear();set.add(oid)}
      state.picked.set(gid,set);lukis();
    });
    wrap.querySelector('[data-batal]').onclick=()=>wrap.remove();
    wrap.querySelector('[data-pilih]').onclick=()=>{
      const pilih=[];let kurang=null;
      groups.forEach(g=>{const set=state.picked.get(g.id)||new Set();
        if(set.size<g.min_select)kurang=g.name;
        set.forEach(id=>{const o=g.options.find(z=>z.id===id);if(o)pilih.push({id:o.id,name:o.name,delta:o.price_delta,group:g.name})})});
      if(kurang)return toast('Pilih '+kurang+' dulu');
      tambah(p,pilih);wrap.remove();toast(p.name+' masuk pesanan');
    };
  };
  lukis();document.body.appendChild(wrap);
}

function gambarKeranjang(){
  const isi=el('#isiKeranjang');if(!isi)return;
  const items=[...state.cart.values()];
  isi.innerHTML=items.length?items.map(x=>`<div class="baris"><div><div class="nama"><b>${esc(x.p.name)}</b></div>
    ${x.opts.length?`<div class="opsi">${esc(x.opts.map(o=>o.name).join(' · '))}</div>`:''}
    <div class="note">${money(x.p.price+(x.opts||[]).reduce((s,o)=>s+o.delta,0))} × ${x.qty}</div></div>
    <div class="qty"><button data-minus="${x.key}">−</button><span>${x.qty}</span><button data-plus="${x.key}">+</button></div></div>`).join(''):'<div class="kosong">Belum ada pesanan.</div>';
  el('#totalKeranjang').textContent=money(totalKeranjang());
  isi.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>ubahQty(b.dataset.minus,-1));
  isi.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>ubahQty(b.dataset.plus,1));
}

let kunciSimpan=null,busy=false;
async function simpanPesanan(){
  if(busy)return;
  const metode=el('#metode').value.trim();
  if(!metode)return toast('Isi metode pembayaran');
  if(!state.cart.size)return toast('Pesanan masih kosong');
  const items=[...state.cart.values()].map(x=>({product_id:x.p.id,quantity:x.qty,modifiers:x.opts.map(o=>({id:o.id}))}));
  const b=el('#simpan');
  if(!kunciSimpan)kunciSimpan=(crypto.randomUUID?crypto.randomUUID():'ks-'+Date.now()+'-'+Math.random().toString(16).slice(2));
  busy=true;b.disabled=true;b.textContent='Menyimpan…';
  try{
    const r=await api('/api/sales',{method:'POST',body:JSON.stringify({items,payment_method:metode,request_id:kunciSimpan})});
    kunciSimpan=null;state.cart.clear();
    toast((r.duplicate?'Sudah tersimpan: ':'Tersimpan: ')+r.item.id);
    await views.kasir();
  }catch(e){toast(e.message);b.disabled=false;b.textContent='Simpan pesanan'}
  finally{busy=false}
}

views.menu=async()=>{
  const p=await loadProduk(true);
  el('#main').innerHTML=title('Menu &amp; Harga','Ubah harga langsung; kosong berarti belum dikonfirmasi.')
   +`<div class="toolbar"><input class="field" id="cariMenu" placeholder="Cari menu…" style="flex:1;min-width:180px">
      <span class="badge">${p.length} menu</span></div>
     <div class="tabel"><table><thead><tr><th>Foto</th><th>Menu</th><th>Kategori</th><th>Varian teks</th><th>Harga</th><th></th></tr></thead><tbody>
     ${p.map(x=>`<tr><td><img class="thumb" src="/static/images/${esc(x.image_key||'snack')}.jpg" alt=""></td>
       <td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td class="note">${esc(x.variant||'—')}</td>
       <td><input class="field" style="width:130px" type="number" min="1" step="500" data-harga="${esc(x.id)}" value="${x.price??''}" placeholder="belum"></td>
       <td><button class="btn mini" data-simpanharga="${esc(x.id)}">Simpan</button></td></tr>`).join('')}
     </tbody></table></div>
     <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Tambah menu</h3>
       <div class="toolbar" style="margin:0">
         <input class="field" id="nNama" placeholder="Nama menu">
         <input class="field" id="nKategori" placeholder="Kategori" value="Makanan">
         <input class="field" id="nVarian" placeholder="Varian teks (opsional)">
         <input class="field" id="nHarga" type="number" min="1" step="500" placeholder="Harga">
         <button class="btn" id="nSimpan">Tambah ke menu</button>
       </div></div>`;
  document.querySelector('#cariMenu').oninput=e=>{const q=e.target.value.toLowerCase();
    document.querySelectorAll('tbody tr').forEach(tr=>{tr.hidden=!tr.innerText.toLowerCase().includes(q)})};
  document.querySelectorAll('[data-simpanharga]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.simpanharga;const v=document.querySelector(`[data-harga="${CSS.escape(id)}"]`).value;
    try{await api('/api/products/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({price:v===''?null:Number(v)})});toast('Harga disimpan');await views.menu()}catch(e){toast(e.message)}
  });
  document.querySelector('#nSimpan').onclick=async()=>{
    const name=el('#nNama').value.trim(),category=el('#nKategori').value.trim(),variant=el('#nVarian').value.trim(),hv=el('#nHarga').value;
    if(!name)return toast('Nama menu wajib diisi');
    try{await api('/api/products',{method:'POST',body:JSON.stringify({name,category:category||'Makanan',variant,price:hv===''?null:Number(hv)})});toast('Menu ditambahkan');await views.menu()}catch(e){toast(e.message)}
  };
};

views.stok=async()=>{
  const p=await loadProduk(true);
  const belum=p.filter(x=>!x.stock_tracked).length;
  el('#main').innerHTML=title('Stok','Simpan hitungan fisik untuk mulai memotong stok otomatis.')
   +`<div class="toolbar"><input class="field" id="cariStok" placeholder="Cari menu…" style="flex:1;min-width:180px">
      <span class="badge ${belum?'':'ok'}">${belum} menu belum dilacak</span></div>
     <div class="tabel"><table><thead><tr><th>Menu</th><th>Status</th><th>Hitung fisik</th><th>Ambang</th><th></th></tr></thead><tbody>
     ${p.map(x=>`<tr data-baris="${esc(x.id)}"><td><div style="display:flex;gap:9px;align-items:center">
        <img class="thumb" src="/static/images/${esc(x.image_key||'snack')}.jpg" alt=""><div><b>${esc(x.name)}</b><div class="note">${esc(x.category)}</div></div></div></td>
       <td>${x.stock_tracked?`<span class="pill ok">Terlacak · ${x.stock_on_hand??'kosong'}</span>`:'<span class="pill warn">Belum dilacak</span>'}</td>
       <td><input class="field" style="width:110px" type="number" min="0" data-hitung="${esc(x.id)}" placeholder="0"></td>
       <td><input class="field" style="width:110px" type="number" min="0" data-ambang="${esc(x.id)}" value="${x.reorder_level??''}" placeholder="—"></td>
       <td><button class="btn mini" data-simpstok="${esc(x.id)}">Simpan</button>
           <button class="btn mini ghost" data-lepas="${esc(x.id)}" ${x.stock_tracked?'':'disabled'}>Tanpa potong stok</button></td></tr>`).join('')}
     </tbody></table></div>`;
  document.querySelector('#cariStok').oninput=e=>{const q=e.target.value.toLowerCase();
    document.querySelectorAll('tbody tr').forEach(tr=>{tr.hidden=!tr.innerText.toLowerCase().includes(q)})};
  document.querySelectorAll('[data-simpstok]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.simpstok;const hit=document.querySelector(`[data-hitung="${CSS.escape(id)}"]`).value;
    const amb=document.querySelector(`[data-ambang="${CSS.escape(id)}"]`).value;
    if(hit==='')return toast('Isi angka hitungan fisik');
    try{
      await api('/api/stock/count',{method:'POST',body:JSON.stringify({product_id:id,counted_quantity:Number(hit),note:'hitung layar'})});
      if(amb!=='')await api('/api/products/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({reorder_level:Number(amb)})});
      toast('Stok disimpan & mulai dilacak');await views.stok();
    }catch(e){toast(e.message)}
  });
  document.querySelectorAll('[data-lepas]').forEach(b=>b.onclick=async()=>{
    try{await api('/api/products/'+encodeURIComponent(b.dataset.lepas),{method:'PUT',body:JSON.stringify({stock_tracked:false})});toast('Menu tidak lagi memotong stok');await views.stok()}catch(e){toast(e.message)}
  });
};

views.riwayat=async()=>{
  const s=await api('/api/sales');
  el('#main').innerHTML=title('Riwayat','Waktu ditampilkan dalam WIB. Menyimpan ulang pesanan yang sama tidak membuat baris baru.')
   +`<div class="tabel"><table><thead><tr><th>Waktu</th><th>ID</th><th>Rincian</th><th>Bayar</th><th>Total</th></tr></thead><tbody>
   ${s.items.length?s.items.map(x=>`<tr><td>${esc(lokal(x.created_at))}</td><td class="note">${esc(x.id)}</td>
     <td>${x.items.map(i=>`<div><b>${esc(i.name_snapshot)}</b> × ${i.quantity}${i.modifiers&&i.modifiers.length?`<div class="note">${esc(i.modifiers.map(m=>m.modifier_name).join(' · '))}</div>`:(i.modifiers_summary?`<div class="note">${esc(i.modifiers_summary)}</div>`:'')}</div>`).join('')}</td>
     <td>${esc(x.payment_method)}</td><td><b style="color:var(--gold)">${money(x.total_amount)}</b></td></tr>`).join(''):'<tr><td colspan="5" class="kosong">Belum ada pesanan.</td></tr>'}
   </tbody></table></div>`;
};

      <div class="card stat"><span>Menu di bawah ambang</span><b>${s.low_stock}</b></div>
      <div class="card stat"><span>Menu terlacak</span><b>${s.tracked_stock}</b></div>
     </div>
     <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Catatan</h3>
     <p class="note">Tanggal usaha: ${esc(s.today)} · zona ${esc(s.timezone)} · mode wajib stok ${s.require_stock?'aktif':'nonaktif'}. Diskon, pajak, service charge, retur, dan tutup kasir belum diterapkan.</p></div>`;
};

views.varian=async()=>{
  const v=await loadVarian(true);const p=await loadProduk(true);
  const kats=[...new Set(p.map(x=>x.category))].sort();
  el('#main').innerHTML=title('Varian &amp; Tambahan','Kelompok varian dipasang per kategori. Contoh: Kopi memakai Suhu, Gula, Es, Ukuran, Extra Shot, Jenis Susu.')
   +`<div class="dua"><div>
     ${v.groups.map(g=>`<div class="kelompok">
       <div class="kepala"><b>${esc(g.name)}</b>
         <span class="pill">${g.min_select>0?'wajib '+g.min_select:'opsional'} · maks ${g.max_select}</span>
         <span style="flex:1"></span>
         <button class="btn mini" data-tambahopsi="${esc(g.id)}">Tambah pilihan</button></div>
       ${g.options.map(o=>`<div class="opsi-baris">
         <input class="field" style="flex:1;min-width:120px" value="${esc(o.name)}" data-onama="${esc(o.id)}">
         <input class="field" style="width:110px" type="number" min="0" step="500" value="${o.price_delta}" data-oharga="${esc(o.id)}">
         <button class="btn mini ghost" data-osimpan="${esc(o.id)}">Simpan</button>
         <button class="btn mini danger" data-ohapus="${esc(o.id)}">×</button></div>`).join('')}
     </div>`).join('')}
     <div class="card"><h3 style="margin-top:0">Kelompok baru</h3>
       <div class="toolbar" style="margin:0">
         <input class="field" id="gNama" placeholder="Nama kelompok (mis. Topping)">
         <input class="field" id="gMin" type="number" min="0" value="0" style="width:90px" title="Wajib pilih minimal">
         <input class="field" id="gMax" type="number" min="1" value="1" style="width:90px" title="Maksimal pilih">
         <button class="btn" id="gSimpan">Buat</button></div>
     </div>
   </div>
   <div><div class="card"><h3 style="margin-top:0">Pasang ke kategori</h3>
     <p class="note">Centang kelompok yang berlaku untuk tiap kategori menu.</p>
     ${kats.map(k=>`<div class="kelompok"><div class="kepala"><b>${esc(k)}</b></div><div class="cek">
       ${v.groups.map(g=>{const on=(v.categories[k]||[]).includes(g.id);
         return `<label class="${on?'on':''}"><input type="checkbox" data-kat="${esc(k)}" value="${esc(g.id)}" ${on?'checked':''}> ${esc(g.name)}</label>`}).join('')}
     </div></div>`).join('')}
   </div></div></div>`;
  document.querySelectorAll('[data-osimpan]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.osimpan;
    const nama=document.querySelector(`[data-onama="${CSS.escape(id)}"]`).value.trim();
    const harga=document.querySelector(`[data-oharga="${CSS.escape(id)}"]`).value;
    try{await api('/api/modifiers/option/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name:nama,price_delta:Number(harga||0)})});toast('Pilihan disimpan');await views.varian()}catch(e){toast(e.message)}
  });
  document.querySelectorAll('[data-ohapus]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Nonaktifkan pilihan ini?'))return;
    try{await api('/api/modifiers/option/'+encodeURIComponent(b.dataset.ohapus),{method:'DELETE'});toast('Pilihan dinonaktifkan');await views.varian()}catch(e){toast(e.message)}
  });
  document.querySelectorAll('[data-tambahopsi]').forEach(b=>b.onclick=async()=>{
    const nama=prompt('Nama pilihan baru:');if(!nama)return;
    const harga=prompt('Tambahan harga (0 kalau gratis):','0');
    try{await api('/api/modifiers/options',{method:'POST',body:JSON.stringify({group_id:b.dataset.tambahopsi,name:nama,price_delta:Number(harga||0)})});toast('Pilihan ditambahkan');await views.varian()}catch(e){toast(e.message)}
  });
  document.querySelector('#gSimpan').onclick=async()=>{
    const name=el('#gNama').value.trim();if(!name)return toast('Nama kelompok wajib diisi');
    try{await api('/api/modifiers/groups',{method:'POST',body:JSON.stringify({name,min_select:Number(el('#gMin').value||0),max_select:Number(el('#gMax').value||1)})});toast('Kelompok dibuat');await views.varian()}catch(e){toast(e.message)}
  };
  document.querySelectorAll('[data-kat]').forEach(c=>c.onchange=async()=>{
    const kategori=c.dataset.kat;
    const ids=[...document.querySelectorAll(`[data-kat="${CSS.escape(kategori)}"]`)].filter(x=>x.checked).map(x=>x.value);
    try{await api('/api/modifiers/category/'+encodeURIComponent(kategori),{method:'PUT',body:JSON.stringify({group_ids:ids})});toast('Kategori '+kategori+' diperbarui');await views.varian()}catch(e){toast(e.message)}
  });
};

/* ---------- router ---------- */
async function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
  try{await views[state.view]()}catch(e){el('#main').innerHTML=`<div class="card">Gagal memuat: ${esc(e.message)}</div>`}
  if(PREVIEW_READ_ONLY)document.querySelectorAll('.btn:not(.ghost)').forEach(b=>{b.disabled=true;b.title='Pratinjau baca-saja'});
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
(async()=>{
  try{const h=await api('/api/health');el('#zonaBadge').textContent=(h.timezone||'Asia/Jakarta')+' · '+h.business_date;el('#modeBadge').textContent='Pratinjau baca-saja'}catch(e){}
  render();
})();
</script>
