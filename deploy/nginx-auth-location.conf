# Included inside the HTTPS virtual host's location / block only.
# The application itself must remain bound to 127.0.0.1; never bypass this gate.
auth_basic "Kopi Sawah - akses tim";
auth_basic_user_file /home/diginavastudio/conf/web/kopisawah.diginavastudio.com/kopi-sawah-users.htpasswd;

proxy_pass http://127.0.0.1:8791;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Authorization "";
proxy_set_header Connection "";
proxy_redirect off;
proxy_read_timeout 30s;
client_max_body_size 1m;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
